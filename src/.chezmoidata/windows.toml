# The Windows user environment, applied by
# .chezmoiscripts/windows/run_onchange_after_302-sync-user-environment.ps1.tmpl.
# Only what is listed here is touched; scoop, winget and installers own the rest.
# To drop an entry or a variable, move it to remove / unset instead of deleting
# it: the script only sees these lists, so a deleted one would stay behind.

# Entries the user PATH must contain (add) or must no longer contain (remove).
[windows.userPath]
add = ['%LOCALAPPDATA%\r-okm\bin']
remove = []

# User variables other than PATH to set to exactly this value (set) or delete
# (unset).
[windows.userEnv]
unset = []

[windows.userEnv.set]
# Claude Code falls back to the PowerShell tool when it cannot find Git Bash.
# That started once scoop's git stopped putting its cmd directory on PATH and
# shipped git as a shim instead; presumably the search starts from git.exe on
# PATH, but how Claude Code looks is not documented.
# current is the junction scoop repoints on every update, so this survives them.
CLAUDE_CODE_GIT_BASH_PATH = 'C:\scoop\apps\git\current\bin\bash.exe'
