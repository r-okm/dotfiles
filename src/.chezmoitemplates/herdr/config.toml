{{/*
  herdr config shared by native Windows (%APPDATA%\herdr\config.toml) and Linux
  (~/.config/herdr/config.toml). The scripts it runs live in %LOCALAPPDATA%\r-okm on Windows
  and in ~/.local/share/r-okm on Linux.
*/ -}}
{{- $windows := eq .chezmoi.os "windows" -}}
# herdr config (written against herdr v0.9.5).
# Carries over the former tmux setup where herdr has an equivalent; "tmux:" comments name the
# tmux setting each one replaces.

onboarding = false

[terminal]
{{- if $windows }}
# Git Bash. With shell_mode = "login" herdr starts bash.exe with -l, so /etc/profile sets up PATH.
# Git is installed with scoop on this machine (scoop prefix git).
default_shell = 'C:\scoop\apps\git\current\bin\bash.exe'
{{- else }}
# default_shell is unset, so herdr falls back to $SHELL (zsh). Login shells, like tmux's panes.
{{- end }}
shell_mode = "login"
new_cwd = "follow"

[theme]
# No built-in frappe variant (catppuccin = mocha, catppuccin-latte, catppuccin-mocha only),
# so the frappe palette is applied on top.
name = "catppuccin"

[theme.custom]
panel_bg = "#303446"
sidebar_bg = "#292c3c"
active_row_bg = "#414559"
selection_bg = "#51576d"
surface0 = "#414559"
surface1 = "#51576d"
surface_dim = "#292c3c"
overlay0 = "#737994"
overlay1 = "#838ba7"
text = "#c6d0f5"
subtext0 = "#a5adce"
accent = "#a6d189"
mauve = "#ca9ee6"
green = "#a6d189"
yellow = "#e5c890"
red = "#e78284"
blue = "#8caaee"
teal = "#81c8be"
peach = "#ef9f76"

[keys]
# tmux: set -g prefix C-g
prefix = "ctrl+g"

# tmux: bind C-c new-window / C-n next-window / C-p previous-window
new_tab = ["prefix+c", "prefix+ctrl+c"]
# tmux: bind -n C-S-F12 / C-S-F11, which Windows Terminal sends for ctrl+pgdn / ctrl+pgup
# (herdr 0.9.5 cannot bind pageup/pagedown: herdrdev/herdr#4892)
next_tab = ["prefix+n", "prefix+ctrl+n", "ctrl+shift+f12"]
previous_tab = ["prefix+p", "prefix+ctrl+p", "ctrl+shift+f11"]
switch_tab = "prefix+1..9"
# tmux: bind -n C-S-F10 / C-S-F9, which Windows Terminal sends for ctrl+shift+pgdn / ctrl+shift+pgup.
# Unlike tmux, which stops at the ends, herdr 0.9.5 wraps around: the last tab moves to the front
# and the first to the back. No option turns that off.
move_tab_next = "ctrl+shift+f10"
move_tab_previous = "ctrl+shift+f9"

# tmux: prefix+s / prefix+w (choose-tree). herdr's default prefix+s opens settings, so move it.
goto = ["prefix+s", "prefix+ctrl+s"]
workspace_picker = ["prefix+w", "prefix+ctrl+w"]
settings = "prefix+comma"

# tmux: bind -n M-k copy-mode (prefix C-[ is Esc to the terminal, so it is not carried over)
copy_mode = ["prefix+[", "alt+k"]

# tmux: bind m / C-m / M-m select-window -t 1
# switch_tab takes a 1..9 range only, so a fixed "tab 1" key is left to prefix+1.

# tmux: bind r source-file (herdr's default prefix+r is resize mode)
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# tmux: bind V -> full scrollback in nvim (needs EDITOR=nvim in the shell environment)
edit_scrollback = ["prefix+v", "prefix+shift+v"]
# tmux: prefix o (default select-pane -t :.+), cycling through the panes of the tab
cycle_pane_next = ["prefix+o", "prefix+ctrl+o"]

split_vertical = "prefix+backslash"
split_horizontal = "prefix+minus"

# tmux: prefix d detach-client (herdr's default is prefix+q)
detach = "prefix+d"

# tmux: bind J break-pane has pane move in the CLI only; no key action.

# zsh: ghq picker, plus linked worktrees. prefix+g is free: goto moved to prefix+s above.
{{- if $windows }}
# Popup commands run through cmd.exe, so %LOCALAPPDATA% expands.
{{- end }}
[[keys.command]]
key = "prefix+g"
type = "popup"
{{- if $windows }}
command = 'python -I -B "%LOCALAPPDATA%\r-okm\bin\herdr-ghq.py"'
{{- else }}
command = 'python3 -I -B "{{ .chezmoi.homeDir }}/.local/share/r-okm/bin/herdr-ghq.py"'
{{- end }}
width = "80%"
height = "80%"

# tmux: bind -n C-e insert-from-editor.sh. herdr has no conditional binding to pass C-e through
# to other panes, so it goes under the prefix (free: edit_scrollback moved to prefix+v above).
# type = "shell" because "pane" opens zoomed and hides the output being replied to; the script
# opens the editor through its own plugin instead.
[[keys.command]]
key = ["prefix+e", "prefix+ctrl+e"]
type = "shell"
{{- if $windows }}
command = 'python -I -B "%LOCALAPPDATA%\r-okm\herdr-plugins\prompt-edit\herdr-edit.py"'
{{- else }}
command = 'python3 -I -B "{{ .chezmoi.homeDir }}/.local/share/r-okm/herdr-plugins/prompt-edit/herdr-edit.py"'
{{- end }}

[ui]
# tmux: set -g mouse on
mouse_capture = true
copy_on_select = true
# Japanese IME: "native" keeps the candidate window at the cursor, at the cost of occasional flicker.
host_cursor = "native"
# tmux: status line at the bottom, session name on the right
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" },
]
# tmux: pane-border-status only when the window is split
pane_borders = "auto"
show_agent_labels_on_pane_borders = true
confirm_close = true
prompt_new_tab_name = false
status_indicators = "symbols"
# Wide enough for "<user>-<branch>" worktree names (the default 26 cuts them after the user prefix).
sidebar_width = 32

# $repo and $branch are pane metadata reported by Claude Code's SessionStart and Stop hooks
# (~/.claude/r-okm/scripts/herdr-report-repo.sh). Claude Code puts the conversation topic in its
# terminal title (herdrdev/herdr discussion #1725).
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "$repo", fg = "#c6d0f5", bold = true }, "state_text"],
  [{ token = "$branch", fg = "#ca9ee6" }],
  ["terminal_title_stripped"],
]

[ui.toast]
{{- if $windows }}
delivery = "system"
{{- else if .chezmoi.kernel.osrelease | lower | contains "microsoft" }}
# The r-okm.wsl-notify plugin (~/.local/share/r-okm/herdr-plugins/wsl-notify) shows Windows
# toasts instead: "system" runs notify-send without the pane, so a click could not focus it.
delivery = "off"
{{- else }}
# "system" runs libnotify's notify-send.
delivery = "system"
{{- end }}

[ui.sound]
enabled = false

[worktrees]
# Only for `herdr worktree create`. git-worktree-herdr and the prefix+g picker keep worktrees
# under <repo>/.worktree (git_worktree_core) and open them with `herdr worktree open`.
directory = "~/.herdr/worktrees"
